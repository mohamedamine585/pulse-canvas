version: '3.8'

services:

 zookeeper:
  image: confluentinc/cp-zookeeper:7.5.0
  container_name: zookeeper
  ports:
    - "2181:2181"
  environment:
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000

 kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper


 postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"  # Exposed PostgreSQL port
    deploy:
      replicas: 1

 canvas-postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: canvaspdb

    ports:
      - "5433:5432"  # Exposed PostgreSQL port
    deploy:
      replicas: 1


volumes:
  postgres-data:
    driver: local  # Use local driver for persistent storage in Swarm

networks:
  pulse-network:
    driver: bridge  # Overlay network for multi-node communication
